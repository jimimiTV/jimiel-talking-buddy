<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4efe4">
  <meta name="buddy-version" content="1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Buddy">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://generativelanguage.googleapis.com; img-src 'self'; style-src 'self'; script-src 'self'; worker-src 'self'; manifest-src 'self'; media-src 'self'; base-uri 'none'; form-action 'self'">
  <title>Buddy</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png" sizes="180x180">
  <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main id="stage" data-state="idle" data-ready="no">
    <button id="face" type="button" aria-label="Buddy">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <ellipse class="shadow" cx="100" cy="178" rx="46" ry="8"></ellipse>
        <g class="buddy">
          <circle class="glow" cx="100" cy="96" r="86"></circle>
          <circle class="rim" cx="100" cy="96" r="74"></circle>
          <circle class="head" cx="100" cy="96" r="70"></circle>
          <ellipse class="highlight" cx="82" cy="70" rx="14" ry="8"></ellipse>
          <ellipse class="cheek" cx="62" cy="112" rx="11" ry="7"></ellipse>
          <ellipse class="cheek" cx="138" cy="112" rx="11" ry="7"></ellipse>
          <g class="eyes">
            <ellipse class="eye" cx="74" cy="90" rx="7" ry="8"></ellipse>
            <ellipse class="eye" cx="126" cy="90" rx="7" ry="8"></ellipse>
            <ellipse class="shine" cx="76" cy="87" rx="2.2" ry="2.2"></ellipse>
            <ellipse class="shine" cx="128" cy="87" rx="2.2" ry="2.2"></ellipse>
          </g>
          <path class="smile" d="M82 116 Q100 134 118 116"></path>
          <ellipse class="mouth" cx="100" cy="120" rx="14" ry="9"></ellipse>
        </g>
      </svg>
    </button>
  </main>
  <div id="corner" aria-hidden="true"></div>
  <div id="setup" hidden>
    <form id="setup-form">
      <p id="setup-title">Gemini key</p>
      <p id="setup-note">Saved on this iPad only.</p>
      <input id="key" name="key" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Paste key">
      <div class="setup-actions">
        <button type="submit">Save</button>
        <button type="button" id="clear">Clear</button>
      </div>
    </form>
  </div>
</body>
</html>
